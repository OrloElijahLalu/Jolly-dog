
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jolly-dog | Menu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    
    <header class="header">

        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="Jolly-dog">
            </a>
        </div>

        <nav class="navigation">
            <a href="index.html">HOME</a>
            <a href="menu.html">OUR MENU</a>
            <a href="#pickup">PICKUP INFORMATION</a>
        </nav>


    </header>


    
    <main class="menu-layout">

        
        <section class="menu-section">

            <div class="menu-heading">
                <h1>OUR MENU</h1>
                <p>Explore our delicious selection of meals and refreshments.</p>
            </div>


            
            <section class="pickup-info" id="pickup">

                <h3>PICKUP ONLY</h3>

                <p>Store Address: Jolly-dog Restaurant</p>

            </section>


            <!-- CATEGORY NAVIGATION -->
            <nav class="categories">

                <a href="#foods">FOODS</a>
                <a href="#drinks">DRINKS</a>
                <a href="#sides">SIDE DISHES</a>
                <a href="#desserts">DESSERTS</a>

            </nav>


            <!-- FOODS -->
            <section class="food-category" id="foods">

                <h2>FOODS</h2>

                <div class="food-container">

                    <!-- Food cards will go here -->

                </div>

            </section>


            <!-- DRINKS -->
            <section class="food-category" id="drinks">

                <h2>DRINKS</h2>

                <div class="food-container">

                    <!-- Drink cards will go here -->

                </div>

            </section>


            <!-- SIDE DISHES -->
            <section class="food-category" id="sides">

                <h2>SIDE DISHES</h2>

                <div class="food-container">

                    <!-- Side dish cards will go here -->

                </div>

            </section>


            <!-- DESSERTS -->
            <section class="food-category" id="desserts">

                <h2>DESSERTS</h2>

                <div class="food-container">

                    <!-- Dessert cards will go here -->

                </div>

            </section>

        </section>


        <!-- SHOPPING CART -->
        <aside class="cart-section" id="cart">

            <h2>MY ORDER</h2>

            <div class="cart-items">

                <!-- Selected items will appear here -->

            </div>

            <div class="cart-summary">

                <!-- Subtotal, tax, and total -->

            </div>

            <button type="button">CLEAR CART</button>

            <a href="checkout.html">PROCEED TO CHECKOUT</a>

        </aside>

    </main>


   
    <footer class="footer">

        <p>&copy; 2026 Jolly-dog. All Rights Reserved.</p>

    </footer>

</body>
</html>
